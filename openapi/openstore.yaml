openapi: 3.0.3

info:
  title: OpenStore API（M1 契约单一真源）
  version: 0.2.0-m1
  description: |
    # 本文件的地位

    本契约是 **M1 的单一真源（single source of truth）**。代码按它反向实现，前端 SDK 与类型由它生成。

    与 `docs/03-后端设计.md` §5 的关系，按下面三条读：

    1. **字段名、枚举值、状态码、错误码以本文件为准**。§5 是散文式表格，个别地方一个单元格里写了两三件事（例如 `cartSummary{count,subtotalAmountMinor}`、
       `movements` 既给 `page` 参数又给裸数组），本文件把它们收敛成**唯一一种写法**。凡本文件与 §5 不一致，视为"§5 表述不精确"，
       已逐条记在 `x-doc-deltas`（见本文件末尾）与 `docs/03` 的修订请求里；**如属语义级冲突（不是表述问题），须回报主理人裁决，不得由实现方单方面拍板**。
    2. **契约里不出现的东西，就是有意不出现的**。例如 storefront 任何 DTO 都不含 `onHand/reserved/sold/cost/margin/internalNote`（§5.1 数据隔离表），
       不要"顺手补上"。
    3. **破坏性变更**：只允许"新增字段 + 旧字段保留 1 个 minor"；`amount` / `totalPages` / `/checkout/submit` / `sort=relevance` 这四种旧写法**已作废**
       （`docs/03` §13 台账），本文件里出现它们即为 bug。

    # 全局约定（读契约前先读这 6 条）

    | 约定 | 内容 |
    |---|---|
    | 金额 | **一律** `{"amountMinor": 29900, "currency": "CNY"}`（`#/components/schemas/Money`）。禁止裸数字、禁止 `"29.90"` 字符串、**禁止旧字段名 `amount`**。列表里的价格、变体价、运费、退款额全部如此 |
    | 分页 | 请求 `page`/`pageSize`；响应固定 `{items, page, pageSize, total, pageCount}`（`pageCount`，不是 `totalPages`）。`pageSize` 默认 24、上限 100（超限 `400 PAGE_SIZE_EXCEEDED`）；`page` 上限 100（超限 `400 PAGE_OUT_OF_RANGE`）；`page` 未超 100 但超过总页数 → **200 + `items: []`**，不是错误 |
    | 时间 | ISO-8601 带偏移（`2025-11-15T16:34:00+08:00`）。服务端 UTC 存储，按 `StoreSettings.TimeZone` 或 `locale` 渲染 |
    | 枚举 | 全部字符串（后端 `JsonStringEnumConverter`），例如 `status: Active`，绝不出现 `1`/`0` 数字魔法值 |
    | 错误 | 全部 `application/problem+json`（RFC 7807）+ 扩展 `code`/`correlationId`/`errors`/`details`。`code` 是**封闭枚举**（`#/components/schemas/ProblemCode`），前端只写一套 `code → i18n key` 的映射 |
    | locale | 所有含内容的读接口接受 `?locale=zh\|en`，缺省默认语言；非法 → `400 LOCALE_NOT_ENABLED`。**"该语言无译文"不是错误**：字段级缺失回退默认语言，页级缺失 `404`（判据见 §5.3.1） |

    # 金额为什么不写成 `29.90`

    `29900` 是整数分，数据库列是 `INTEGER`/`BIGINT`，前端按 `currency` 的小数位格式化。一旦允许字符串小数，
    `0.1 + 0.2` 与四舍五入规则会在"下单服务"和"支付通道"之间分叉，对账永远差几分钱。

    # 鉴权口径（两套 Cookie，互不串味）

    - 管理端：`os_admin_sid`（HttpOnly / Secure / SameSite=Lax / **Path=/api/admin**）+ `os_admin_csrf`（非 HttpOnly，供 double-submit，Path=/）。
      `Path` 收窄是安全边界：商城页面上的任何脚本都拿不到管理员会话（§6.1）。
    - 所有 `POST/PUT/PATCH/DELETE /api/admin/*` **必须**带 `X-CSRF-Token`（值 = `os_admin_csrf` 的值），否则 `403 AUTH_CSRF_INVALID`。
      本文件在每个写操作上把它声明为 required header 参数，前端由 `withCsrf()` 统一注入。
    - **未登录调 admin 接口 → 401 `AUTH_SESSION_EXPIRED`**（不是 403），也不区分"端点不存在"与"没权限"，不泄露端点存在性。
    - 权限点是**唯一权威**：每个 `/api/admin/**` 操作都用 `x-permission` 扩展声明所需权限点（值域见 `#/components/schemas/PermissionCode`，
      严格照 `docs/03` §6.4 矩阵）。前端隐藏菜单只是 UX，**服务端 403 才是结论**。裸"只校验已登录"的端点在本契约里不存在（除 auth 三兄弟）。

    # 幂等与并发

    - 变体矩阵 `POST /variants/apply` **幂等**：同一 `plan` 重复 apply 不产生任何行变更，返回 `changed: false`。
    - 库存调整、批量改库存走 `StockItem.AdjustOnHand` + 不可变流水（`StockLedger`），并受 `OnHand >= Reserved + Sold` 约束。
    - 可变资源（商品/分类/属性/属性集）响应带 `version`；更新时带上它即开启乐观锁，不匹配 → `409 CONCURRENT_UPDATE`。
      **不传 = last-write-wins**（M1 单管理员场景可接受，两个浏览器窗口同时编辑则会被静默覆盖——这是明确的取舍，不是遗漏）。

    # 数据源故障 ≠ 空结果（AC-10 负向断言）

    `200 + items: []` 只允许在"确实没有匹配数据"（`total` 为真实 0）时返回。DB 不可用、查询报错、缓存源数据读失败一律
    `503 SERVICE_UNAVAILABLE` + `ProblemDetails` + `Retry-After`。把异常吞成空列表会让"空白的商品页"被搜索引擎收录，
    比不收录更糟；也会让反代的可用性告警因为"永远 200"而不响。
  contact:
    name: 程不宕（后端服务工程师）
  license:
    name: Proprietary

servers:
  - url: /
    description: 同源部署（Caddy 反代 → API）。所有对外绝对 URL 只能由 `StoreSettings.PublicSiteUrl` 生成，禁止读 `Host` 头（AC-10）

tags:
  - name: Admin.Auth
    description: 管理员认证与会话（真实 Session，DB 校验，封禁/改密立即生效）
  - name: Admin.Taxonomy
    description: 分类 / 属性 / 属性集（录商品的前置数据）
  - name: Admin.Catalog
    description: 商品、变体矩阵、图片、上下架
  - name: Admin.Inventory
    description: 库存列表与手工调整（只追加流水，无编辑/删除端点）
  - name: Storefront.Catalog
    description: 门店公开目录读接口（匿名可访问）
  - name: Health
    description: 存活/就绪探针（供容器编排与反代直取，仅内网）

paths:

  # ==========================================================================
  # Admin.Auth
  # ==========================================================================

  /api/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin.Auth]
      summary: 管理员登录
      description: |
        失败统一 `401 AUTH_INVALID_CREDENTIALS`（**不区分**账号不存在与密码错，防账号枚举：对不存在账号也跑一次 dummy hash，
        响应时间差 < 20ms）。连续 5 次失败 → 账号锁 15 分钟 → `423 AUTH_LOCKED` + `details.unlockAt`（明确告知何时可试，
        减少客服，而不是让用户自己数着次数猜）。

        成功后：① 先删旧 Session 再建新（防 session fixation）② 两条 Set-Cookie ③ 返回权限点集合供前端渲染菜单（**仅 UX**）。

        仍要做 `Origin` 校验（防登录 CSRF）：`Origin` 缺失或非本站 → `403 AUTH_CSRF_INVALID`。此端点**不要求** `X-CSRF-Token`（还没有会话）。
      security: []
      x-permission: null
      x-csrf-required: false
      x-rate-limit: { policy: login, permitsPerMinutePerEmail: 5, permitsPer15MinutesPerIp: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320, example: owner@example.com }
                password: { type: string, minLength: 1, maxLength: 128, format: password }
      responses:
        '200':
          description: 登录成功（服务端已建 Session）
          headers:
            Set-Cookie:
              description: |
                同时下发两条 Cookie（OpenAPI 的 header 名唯一，故在此并列说明）：
                1. `os_admin_sid=<32B base64url>; HttpOnly; Secure; SameSite=Lax; Path=/api/admin`（会话，DB 只存 SHA-256）
                2. `os_admin_csrf=<32B base64url>; Secure; SameSite=Lax; Path=/`（非 HttpOnly，前端读出来放进 `X-CSRF-Token`）
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminIdentity' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '423': { $ref: '#/components/responses/LockedProblem' }
        '429': { $ref: '#/components/responses/TooManyRequestsProblem' }

  /api/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin.Auth]
      summary: 管理员登出
      description: |
        `Session.RevokedAt = now, RevokeReason = logout` + 清 Cookie。**服务端撤销是权威**：登出后浏览器回退按钮回到旧页面，
        任何 `/api/admin/*` 请求都是 `401`（US-E8-01）。幂等：已撤销的会话重复登出仍 `204`。
      security: [{ adminSession: [] }]
      x-permission: null
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已登出（Cookie 已清） }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }

  /api/admin/auth/me:
    get:
      operationId: adminMe
      tags: [Admin.Auth]
      summary: 当前管理员 + 权限点
      description: |
        admin SPA 的登录态判定入口（`os_admin_sid` 的 Path 限定在 `/api/admin`，所以 `/admin` 静态页导航时浏览器不发 Cookie，
        不能靠"有没有 Cookie"判断）。`sessionExpiresAt` 供前端提示"会话即将过期"。
      security: [{ adminSession: [] }]
      x-permission: null
      responses:
        '200':
          description: 当前会话对应的管理员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminIdentity'
                  - type: object
                    required: [sessionExpiresAt]
                    properties:
                      sessionExpiresAt:
                        type: string
                        format: date-time
                        description: 会话绝对过期时间（Admin 默认 7 天）；空闲过期另算（默认 120 分钟）
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }

  /api/admin/auth/change-password:
    post:
      operationId: adminChangePassword
      tags: [Admin.Auth]
      summary: 修改自己的密码
      description: |
        成功后 revoke **该管理员全部会话**（含当前这条）+ 轮换 `SecurityStamp` + 轮换 CSRF，所以前端必须重新登录（INV-AD02 / AC-15）。
        "改密即踢下线"是选 Session 而非 JWT 的核心理由：JWT 要靠黑名单，等于又做一遍 Session。

        密码策略（§6.7）：12–128 字符、不得纯数字、不得命中 Top-1000 弱口令。违反 → `400 VALIDATION_FAILED`（字段级）。
        `currentPassword` 不匹配同样走 `400 VALIDATION_FAILED`（`errors.currentPassword`）——此时用户已认证，
        不需要用 401 去防枚举，字段级提示更有用。
      security: [{ adminSession: [] }]
      x-permission: null
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128, format: password }
                newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
      responses:
        '204': { description: 已改密（全部会话已撤销，需重新登录） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '429': { $ref: '#/components/responses/TooManyRequestsProblem' }

  # ==========================================================================
  # Admin.Taxonomy —— 分类
  # ==========================================================================

  /api/admin/categories:
    get:
      operationId: adminListCategories
      tags: [Admin.Taxonomy]
      summary: 分类树（管理端）
      description: |
        一次返回整棵树（分类总量在百级，全表进内存组装，**不分页**：分页的树没有意义）。
        每个节点带 `childCount` / `productCount`，供前端在"删除"按钮上提前显示拦截原因，而不是等用户点了才报错。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.read
      responses:
        '200':
          description: 分类树（`children` 递归）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminCategory' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }
    post:
      operationId: adminCreateCategory
      tags: [Admin.Taxonomy]
      summary: 新建分类
      description: |
        新建即 `Status=Active`、`sortOrder` 缺省追加到同级末尾。`names` 的默认语言键必填（INV-P01 同源规则）。
        `slugs` 缺省时按对应语言 `names` 规范化生成（小写 + 连字符）；`(locale, slug)` 全局唯一，冲突 → `409 VALIDATION_FAILED`（字段级）。
        深度上限 5（INV-C02）→ 超限 409。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpsertRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Location: { schema: { type: string, example: /api/admin/categories/01J8ZC4WQ7 }, description: 新建分类的规范地址 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/categories/reorder:
    put:
      operationId: adminReorderCategories
      tags: [Admin.Taxonomy]
      summary: 拖拽排序 / 移动分类
      description: |
        一次提交整棵受影响子树的 `(id, parentId, sortOrder)`，在**单事务内**校验：
        ① 无环（INV-C01）→ `409 CATALOG_CATEGORY_CYCLE`；② 深度 ≤ 5（INV-C02）→ `409 CATALOG_CATEGORY_DEPTH_EXCEEDED`；
        ③ 同父下 `sortOrder` 唯一（INV-C03）→ `409 CATALOG_CATEGORY_SORT_CONFLICT`。
        移动节点时服务端重算整条子树的物化路径 `Path`（INV-C06），并写 `SlugHistory`（若 slug 因移动规则而变）。
        整树校验要么全成要么全不成：**不做部分应用**（部分应用会让树的 `Path` 与 `ParentId` 短暂互斥，是最难查的状态）。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items: { $ref: '#/components/schemas/CategorySortItem' }
      responses:
        '204': { description: 已应用（整树校验通过） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/categories/{id}:
    get:
      operationId: adminGetCategory
      tags: [Admin.Taxonomy]
      summary: 分类详情
      description: 单个分类节点（含 `childCount`/`productCount` 与两语言名、slug）。分类树请用 `GET /api/admin/categories`。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.read
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 分类节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: adminUpdateCategory
      tags: [Admin.Taxonomy]
      summary: 更新分类
      description: |
        全量更新 `names` / `slugs` / `parentId` / `sortOrder` / `attributeSetId` / `status`。
        `slugs` 变更会写 `SlugHistory` → 旧 URL 走 301（AC-11）。移动父节点等同 `reorder` 的单项版本，同样校验无环与深度。
        带 `version` 则做乐观锁（不匹配 `409 CONCURRENT_UPDATE`）。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpsertRequest' }
      responses:
        '200':
          description: 更新后的分类节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
    delete:
      operationId: adminDeleteCategory
      tags: [Admin.Taxonomy]
      summary: 删除分类（软删）
      description: |
        有子分类或已挂商品时**拒绝**（INV-C05），`409 CATALOG_CATEGORY_NOT_EMPTY` + `details{childCount, productCount}`
        —— 把数字给前端，前端才能显示"该分类下还有 3 个子分类、12 个商品"，而不是干巴巴一句"删除失败"。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已软删 }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  # ==========================================================================
  # Admin.Taxonomy —— 属性
  # ==========================================================================

  /api/admin/attributes:
    get:
      operationId: adminListAttributes
      tags: [Admin.Taxonomy]
      summary: 属性定义列表
      description: |
        **不分页**：属性定义是百级以内的小集合，管理端要一次拿全（分类编辑、属性集编辑、商品录入三处都要做下拉）。
        分页会让每个下拉框先请求一次"总数"，纯浪费。`usageCount` 让前端提前禁用"改 dataType"这类危险操作。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.read
      parameters:
        - { name: scope, in: query, required: false, description: 按作用域筛选（Variant 轴只能取 Scope=Variant 且 DataType=Enum）, schema: { type: string, enum: [Product, Variant] } }
        - { name: q, in: query, required: false, description: 按 code / 名称模糊匹配, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: 属性定义数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttributeDefinition' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      operationId: adminCreateAttribute
      tags: [Admin.Taxonomy]
      summary: 新建属性定义
      description: |
        约束（INV-A01/A02/A04/A05）：`code` 全局唯一且匹配 `^[a-z][a-zA-Z0-9]{1,39}$`；默认语言名称必填；
        `scope=Variant` 只允许 `dataType=Enum`；`dataType=Enum/MultiEnum` 必须 ≥1 个 option。
        冲突码：`code` 重复 → `409 CATALOG_CODE_DUPLICATE`；`scope/dataType` 组合非法或名称缺失 → `400 VALIDATION_FAILED`（字段级）或
        `409 AXIS_SCOPE_INVALID`。`dataType/scope` 一旦有 `usageCount > 0` 就不可改（INV-A03）→ `409 CATALOG_ATTRIBUTE_IN_USE`。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeUpsertRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Location: { schema: { type: string, example: /api/admin/attributes/01J8ZD2M5K } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeDefinition' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/attributes/{id}:
    get:
      operationId: adminGetAttribute
      tags: [Admin.Taxonomy]
      summary: 属性定义详情
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.read
      parameters:
        - $ref: '#/components/parameters/IdPath'
