    - id: D11
      state: resolved
      where: docs/03 §5.1/§5.6.1 `maxOrderQuantity` = `min(99, available)`（原冲突对象是数据模型 §8.2 的旧句，该句已在 02 里带删除线作废）
      contract: '`maxOrderQuantity = min(99, available)`（真实 available，不受截断影响），**主理人裁决 R1 已定稿**'
      why: |
        **本条已消解，不是待办**：数据模型 §8.2 已按 A1 改判并在原文留删除线 + "已作废"标注，
        "契约 vs 数据模型"的冲突不再存在，任何一侧都不需要再改。
        保留编号只为追溯（02/04 可能引用过 D11），**不要读成"还有一条没处理"**。

        R1 裁决理由（原文要点）：前台加购必须受可售量约束，否则用户能加 10 件而库存只有 3 件，
        报错要等到下单那一步 —— 那时用户已经填完地址与支付方式，属于最贵的失败点。
        `min(99, available)` 同时表达"单次最多 99"与"不超过现有库存"，也是 §5.6.1 的原意。

        **与 `availableQuantity` 的口径区别（不许合并成一个字段）**：
        - `availableQuantity`：`available ≤ 5` 给真实值，`> 5` 给 `null` —— 目的是**防竞品爬库存**。
        - `maxOrderQuantity`：永远用**真实** `min(99, available)` —— 目的是**让加购可以被正确限制**。
        若两者共用一个被截断的值，库存 50 件时加购会被限制成 5 件；若共用真实值，则精确库存被泄露。
