      summary: 更新属性集（成员全量替换）
      description: |
        `members` 是**全量替换**语义（列表里没有的成员被移除），因为它表达的是"这个属性集包含哪些属性"这一个事实；
        若按增量 patch 写，前端做删除时就得知道"当前有哪些"，反而更容易漂移。
        注意：已挂到分类上的属性集被移除成员时，该分类继承链上的属性集合会变小 —— 已录入的商品属性值不受影响（值是独立行）。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
