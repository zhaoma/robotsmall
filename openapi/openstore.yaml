      where: docs/03 §5.4 商品列表/创建返回并接收 `skuRoot`，但数据模型 `Product` 表**没有 `SkuRoot` 列**
      contract: '**已按主理人裁决 R2 从契约删除 `skuRoot`**（列表项、创建请求、详情、plan 建议 SKU 全部不再出现该字段）'
      why: |
        1. 数据模型没有这一列，而为它加列等于引入"建品时必须生成 SKU 前缀"的规则。
        2. SKU 已经是**外部系统/物流/条码的唯一键**（数据模型 §3.1 明确「CSV 单向导入按 SKU 判重」）。
           服务端自动派生前缀会与导入的 SKU 撞唯一键，而且撞了之后无法解释"这个前缀是哪套规则生成的"。
        3. `InternalCode` 已承担"商家内部编码"职责，两个字段语义重叠，必然有人填一个忘一个。
        落地方案：SKU 由商家填写，或由 `VariantMatrix` 按轴值**生成建议值**（前端预填、服务端只校验格式与全局唯一），
        不引入任何服务端前缀规则。这是"能靠结构排除的错误，不靠纪律去防"的同类做法。
