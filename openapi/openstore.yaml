  # ==========================================================================
  # Admin.Catalog —— 商品
  # ==========================================================================

  /api/admin/products:
    get:
      operationId: adminListProducts
      tags: [Admin.Catalog]
      summary: 商品列表（管理端）
      description: |
        `sort`：`created_at_desc`（缺省）/ `total_desc`（`totalOnHand` 降序，用于"库存最多的是哪些"）/ `status`。
        非法值 → `400 VALIDATION_FAILED`。**admin 可见库存与内部编码**（storefront 的列表 DTO 里这些字段根本不存在）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.read
      parameters:
        - { name: q, in: query, required: false, description: 按商品名 / 内部编码 / SKU 根模糊匹配, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [Draft, Active, Archived] } }
        - { name: categoryId, in: query, required: false, description: 含子分类（走 Path 前缀匹配）, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [created_at_desc, total_desc, status], default: created_at_desc } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: 分页商品列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductListResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }
    post:
      operationId: adminCreateProduct
      tags: [Admin.Catalog]
      summary: 新建商品（草稿态）
      description: |
        **新建即 `Draft`，不给"新建即可售"的捷径**（上架是独立动作，`POST /{id}/publish`，且要过 INV-P10 校验）。
        INV-P02：至少 1 个分类（`categoryIds` minItems=1）。INV-P01：默认语言名称必填。
        单个规格商品 = **一个变体**（不是零个变体）；变体由 `variants/apply` 或首个 `PUT /{id}` 之后的矩阵流程建立，
        因此本端点不接收 `variants`，避免"建品"与"建变体"两个写入口同时存在。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201':
          description: 已创建（Draft）
          headers:
            Location: { schema: { type: string, example: /api/admin/products/01J8ZF9H2X } }
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [Draft] }
                  slug:
                    type: string
                    description: 默认语言 slug（由 names 规范化生成，后续可在 PUT 里显式改）
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [Admin.Catalog]
      summary: 商品详情（管理端全量）
      description: |
        管理端可见**成本外的一切**：内部编码、内部备注、库存三件套（`onHand/reserved/sold/available`）、变体、图片、属性值、上下架时间。
        **注意 storefront 的对应 DTO 是独立类型、无继承关系**（§5.1 类型隔离），不要指望"给 storefront 少填几个字段"：
        那会让新增列默认被带出去。白名单投影，不是黑名单排除。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.read
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 商品全量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: adminUpdateProduct
      tags: [Admin.Catalog]
      summary: 更新商品基础信息
      description: |
        只改**基础信息**：`names/slugs/descriptionHtml/shortDescription/seo/categoryIds/attributes/internalCode/internalNote/weightGram`。
        **不接收 `images` 与 `variants`**：图片走 `POST /{id}/images` 系列，变体走 `variants/*` 系列。
        理由：同一事实两个写入口必然漂移（一个把主图设成 A、另一个设成 B，最后谁生效取决于谁后到）。
        `attributes` 是全量替换（商品级属性值）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: 更新后的商品全量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
    delete:
      operationId: adminDeleteProduct
      tags: [Admin.Catalog]
      summary: 删除商品（软删）
      description: |
        **需要 `perm:catalog.delete`（员工无此权限点，破坏性操作）**。软删：行保留、`IsDeleted=1`、SKU 不复用（防串号），
        历史订单靠快照渲染，完全不受影响。有销量的变体不会被物理删除（INV-P09）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.delete
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已软删 }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /api/admin/products/{id}/status:
    patch:
      operationId: adminChangeProductStatus
      tags: [Admin.Catalog]
      summary: 状态变更（**单向：回到 Draft**）
      description: |
        这是 `publish` / `archive` 之外**唯一**的状态写入口，且方向被收窄为 **`Active`/`Archived` → `Draft`**，
        即"下架之后改回草稿继续编辑"。

        为什么不许它把状态往前推（`Draft → Active`）：
        - 上架要做 INV-P10 前置校验（≥1 启用变体、≥1 张图、≥1 分类、每个变体有价）。走这个端点等于绕开校验，
          前台就会出现"没有价格的商品"——转化率黑洞，且无法事后区分是漏校验还是商家故意。
        - 两个能自由切换状态的写入口，最后一定会出现"一个把商品改成 Active、另一个改成 Archived"的并发覆盖，
          而状态变更必须同时维护 `PublishedAt`、缓存失效、sitemap，这些副作用只在上架/下架用例里做。

        已 `Draft` 时重复调用幂等返回 `204`。目标值不是 `Draft` → `400 PRODUCT_STATUS_INVALID`（`details.allowedStatus=[Draft]`）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      x-direction: draft-only
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Draft]
                  description: '**只接受 Draft**。上架请用 `POST /{id}/publish`，下架请用 `POST /{id}/archive`'
      responses:
        '204': { description: 已回到草稿态（或本来就是草稿，幂等） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/variants/plan:
    post:
      operationId: adminPlanVariants
      tags: [Admin.Catalog]
      summary: 预览变体矩阵（纯函数，不落库）
      description: |
        输入轴定义（≤3 轴，INV-P04），输出四桶计划：`toAdd`（要新建）、`toKeep`（保留）、`toDisable`（停用：不在新组合里但**有销量**，只能停用）、
        `toDelete`（删除：不在新组合里且无销量）。

        **本端点不写库**（US-E2-05「重复点击不产生重复行」的落地方式：预览 100 次也不会多出一行，
        因为唯一的写入口是 `variants/apply`）。`warnings[]` 把"将被删除/停用的变体数"与"新变体缺价"提前告知管理员，
        避免他点完 apply 才发现少了 12 个 SKU。

        错误：`409 AXIS_LIMIT_EXCEEDED`（轴 > 3）、`409 AXIS_SCOPE_INVALID`（轴属性不是 Scope=Variant 或不是 Enum）、
        `409 VARIANT_LIMIT_EXCEEDED`（笛卡尔积 > 100）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantPlanRequest' }
      responses:
        '200':
          description: 变体矩阵计划（未落库）
          content:
            application/json:
              schema:
                type: object
                required: [productId, plan]
                properties:
                  productId: { type: string }
                  plan: { $ref: '#/components/schemas/VariantMatrixPlan' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/variants/apply:
    post:
      operationId: adminApplyVariants
      tags: [Admin.Catalog]
      summary: 应用变体矩阵（幂等）
      description: |
        **幂等**：同一 `plan` 重复 apply = 无变化（`changed: false`，四桶计数全 0，不写任何行、不产生审计噪音）。
        这是 US-E2-05 的硬要求：管理员连点三下保存不能变成三倍变体。

        请求二选一（`oneOf`）：传 `plan`（前端把 `variants/plan` 的返回原样提交，服务端逐项比对当前状态执行）；
        或传 `axes`（服务端重算后直接应用，用于脚本/导入）。
        `toDelete` 只包含**无销量且不在新组合中**的变体；有销量的进 `toDisable`（INV-P09）。
        轴一旦生成，轴属性集合不可在线变更（INV-P12 `409 AXIS_IMMUTABLE`）—— 要换轴请先停用全部变体。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      x-idempotency:
        key: '由请求体派生：sha256(canonical(plan))；同 key 重复提交返回 changed=false。无需客户端提供 Idempotency-Key（本操作不涉及资金）'
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantApplyRequest' }
      responses:
        '200':
          description: 应用结果 + 最新变体列表
          content:
            application/json:
              schema:
                type: object
                required: [changed, applied, variants]
                properties:
                  changed: { type: boolean, description: 'false = 本次调用没有产生任何行变更（幂等重放）' }
                  applied:
                    type: object
                    required: [added, kept, disabled, deleted]
                    properties:
                      added: { type: integer, minimum: 0 }
                      kept: { type: integer, minimum: 0 }
                      disabled: { type: integer, minimum: 0 }
                      deleted: { type: integer, minimum: 0 }
                  variants:
                    type: array
                    items: { $ref: '#/components/schemas/AdminVariant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/variants/bulk:
    post:
      operationId: adminBulkUpdateVariants
      tags: [Admin.Catalog]
      summary: 批量改变体价格 / 库存
      description: |
        一次最多 200 个变体。**改库存必须带 `reason`**（US-E2-08「手工调整必填原因」），且走的不是直接改列，
        而是 `StockItem.AdjustOnHand` + 一条不可变 `StockLedger` 流水（`ChangeType=ManualAdjust`）：
        否则"库存为什么从 100 变 0"永远查不出来。`newOnHand < reserved + sold` → `409 INVENTORY_NEGATIVE_FORBIDDEN`。
        改价受 INV-P03（`price.amountMinor > 0`，`compareAtPrice >= price`）与 INV-P11（币种必须等于店铺币种）约束。
        整体单事务：**任一变体失败则全部不生效**（部分成功会让管理员无法判断"到底改了哪些"）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantBulkUpdateRequest' }
      responses:
        '204': { description: 已应用（全部成功） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/variants/{variantId}:
    patch:
      operationId: adminPatchVariant
      tags: [Admin.Catalog]
      summary: 单变体：价格 / 图 / 条码 / 启停
      description: |
        **部分更新**：只改传了的字段，未传的不动（`PATCH` 语义）。这正是它与 `variants/apply`（矩阵级、全量）的分工。

        价格是**单个 `Money` 对象**，不是数组：数据库本期是内联三列（`AmountMinor/CompareAtMinor/Currency`），
        二期改成 `VariantPrice(VariantId, Currency)` 后对外契约仍然不变（§11 #15 的配套要求）。
        `compareAtPrice: null` 是"清除划线价"，**不是"不改"**：要区分"不改"就别传这个键（`undefined` vs `null`）。
        `purchasable=false` 等价于 `Variant.Status=Disabled`：不进前台可选集，但历史订单靠快照照常展示。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: variantId, in: path, required: true, description: 变体标识（不透明字符串）, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantPatchRequest' }
      responses:
        '200':
          description: 更新后的变体
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVariant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/publish:
    post:
      operationId: adminPublishProduct
      tags: [Admin.Catalog]
      summary: 上架
      description: |
        前置校验 INV-P10：≥1 个启用变体、≥1 张图、≥1 个分类且默认语言必填字段完整、每个变体至少一档价格。
        不满足 → `409 PRODUCT_NOT_PUBLISHABLE` + `details{reasons[]}`（逐条列出缺什么，让管理员一次补齐，
        而不是修一条报一条）。首次上架写入 `PublishedAt`（"新品"排序的依据）。
        已 `Active` 时重复调用幂等返回 `204`。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已上架（`status=Active`，storefront 立即可见） }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/archive:
    post:
      operationId: adminArchiveProduct
      tags: [Admin.Catalog]
      summary: 下架（归档）
      description: |
        `Archived` 后：从 storefront 列表与 sitemap 消失，**旧商品 URL 返回 `410`**（不是 301：链接还在、
        但内容永久没了，410 能让搜索引擎更快摘除，301 会把权重导向一个不存在的新地址）。
        下架原因是自由文本，进审计日志。已有订单不受影响（订单渲染靠快照）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: 下架原因（写审计，不对外） }
      responses:
        '204': { description: 已下架（`status=Archived`） }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /api/admin/products/{id}/images:
    post:
      operationId: adminUploadProductImage
      tags: [Admin.Catalog]
      summary: 上传商品图片
      description: |
        `multipart/form-data`。白名单 `image/jpeg|image/png|image/webp`，≤ 5 MB。
        **先读文件头限像素、再解码**（§8.7）：一张 10 亿像素的 PNG 解压炸弹能在 2 秒内把 512MB 容器打死，
        而它只有几百 KB。解码后统一用 ImageSharp 重编码（剥 EXIF，含 GPS）。
        服务端派生三档 `sm/md/lg`（绝对 URL，前缀来自 `StoreSettings.PublicSiteUrl`）。
        `isPrimary=true` 时自动把原主图降级，保证 INV-P08（有图则主图恰好一张、图数 ≤ 8）。
        非图片/超限 → `400 VALIDATION_FAILED`（`errors.file`）；图数超 8 → `409 INV_PRIMARY_IMAGE_INVALID`。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: '≤5MB；jpg/png/webp' }
                alt: { type: string, maxLength: 255, description: 默认语言 alt（a11y 与图片 SEO） }
                isPrimary: { type: boolean, default: false }
      responses:
        '201':
          description: 已上传并派生尺寸
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageAsset' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/images/order:
    put:
      operationId: adminReorderProductImages
      tags: [Admin.Catalog]
      summary: 图片排序 / 设定主图
      description: |
        提交全部图片的 `(mediaKey, sortOrder, isPrimary)`，服务端校验 INV-P08（`isPrimary` 恰好一张；图数 ≤ 8），
        不满足 → `409 INV_PRIMARY_IMAGE_INVALID` + `details{primaryCount, imageCount}`。
        **整表替换**语义：列表里缺失的 `mediaKey` 视为"未提交"而不是"删除"（删除有独立端点，避免误传导致批量丢图）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 8
              items: { $ref: '#/components/schemas/ImageOrderItem' }
      responses:
        '204': { description: 已应用 }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/products/{id}/images/{mediaKey}:
    delete:
      operationId: adminDeleteProductImage
      tags: [Admin.Catalog]
      summary: 删除商品图片
      description: |
        删除主图会留下"有图但无主图"的状态（违反 INV-P08）→ `409 INV_PRIMARY_IMAGE_INVALID`，
        必须先 `PUT images/order` 把另一张设为主图。删除是"解绑 + 引用计数归零才删文件"（同一媒体可被多商品共用，去重后只存一份）。
      security: [{ adminSession: [] }]
      x-permission: perm:catalog.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: mediaKey, in: path, required: true, description: 媒体键（`StorageKey`，含 `/` 时需 URL 编码）, schema: { type: string, maxLength: 300 } }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  # ==========================================================================
  # Admin.Inventory
  # ==========================================================================

  /api/admin/inventory:
    get:
      operationId: adminListInventory
      tags: [Admin.Inventory]
      summary: 库存列表
      description: |
        `available = onHand − reserved − sold`（**计算属性，永不落库**）。`lowStockOnly=true` 等价于 `available ≤ 5`，
        与 storefront 的 `low_stock` 用同一个阈值，避免"前台说快没了、后台说不紧张"。
        `total` 是真实计数；`items: []` 只在真的有 0 条匹配时返回（数据源故障是 `503`，不是空列表）。
      security: [{ adminSession: [] }]
      x-permission: perm:inventory.read
      parameters:
        - { name: q, in: query, required: false, description: 按 SKU / 商品名模糊匹配, schema: { type: string, maxLength: 100 } }
        - { name: lowStockOnly, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: 分页库存列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryListResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }

  /api/admin/inventory/{variantId}/adjust:
    post:
      operationId: adminAdjustInventory
      tags: [Admin.Inventory]
      summary: 手工调整在库数量
      description: |
        语义是"**把 `onHand` 设成 `newOnHand`**"（盘点口径），不是增量：管理员看到货架上有 7 件就填 7，
        不需要先算差值。差值由服务端写入流水（`delta = newOnHand − onHand`）。

        `reason` **必填**（US-E2-08）：流水表是可追溯的唯一手段，一条没有原因的 `+50` 与"有人绕过 API 改库"无法区分。

        约束：`newOnHand ≥ onHand_allocated`，其中 `onHand_allocated = reserved + sold`（INV-S07）。
        违反 → `409 INVENTORY_NEGATIVE_FORBIDDEN` + `details{reserved, sold, minimumOnHand}`
        —— 直接把"最低能填多少"告诉前端，比让管理员自己减法猜要快得多。
        并发冲突（乐观锁重试 1 次仍失败）→ `409 STOCK_CHANGED_RETRY`（重新取数再提交）。
      security: [{ adminSession: [] }]
      x-permission: perm:inventory.adjust
      x-csrf-required: true
      parameters:
        - { name: variantId, in: path, required: true, description: 变体标识（不透明字符串）, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOnHand, reason]
              properties:
                newOnHand: { type: integer, minimum: 0, maximum: 1000000, description: 调整后的物理在库总数（含已售未发） }
                reason: { type: string, minLength: 1, maxLength: 500, description: '必填。写进 StockLedger.Reason 与审计日志' }
      responses:
        '200':
          description: 调整结果
          content:
            application/json:
              schema:
                type: object
                required: [onHand, available, movementId]
                properties:
                  onHand: { type: integer, minimum: 0, description: 调整后的物理在库数 }
                  available: { type: integer, description: 'onHand − reserved − sold' }
                  movementId: { type: string, description: 本次写下的 StockLedger 流水号（可据此在流水列表里核对该次调整） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '429': { $ref: '#/components/responses/TooManyRequestsProblem' }

  /api/admin/inventory/{variantId}/movements:
    get:
      operationId: adminListInventoryMovements
      tags: [Admin.Inventory]
      summary: 库存流水（只读）
      description: |
        只追加表的读出口，**没有编辑/删除端点**（`IStockLedger` 不暴露 Update/Remove，PG 下还会 `REVOKE UPDATE, DELETE`）。
        响应走统一分页信封（`docs/03` §5.4 这一行给的是裸数组 + `page` 参数，本契约按 §5.1「分页统一」收敛为信封）。

        `changeType` 让管理员看懂"这 3 件是被谁扣的"：`Reserve` 是下单预占、`Commit` 是支付成功、`Ship` 是发货离仓、
        `RefundUncommit`/`RefundRestock` 分别对应"未发货退款只解除占用"与"已发货退款回补进可售池"。
      security: [{ adminSession: [] }]
      x-permission: perm:inventory.read
      parameters:
        - { name: variantId, in: path, required: true, description: 变体标识（不透明字符串）, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: 分页流水列表（按时间倒序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryMovementListResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # ==========================================================================
  # Storefront.Catalog —— 全部 Public
  # ==========================================================================

  /api/storefront/products:
    get:
      operationId: listStorefrontProducts
      tags: [Storefront.Catalog]
      summary: 商品列表 + facet + 可用排序
      description: |
        **一次请求返回 items + facets + availableSorts**（拆成两个请求会让"筛选后的 facet 计数"和"列表"来自不同快照，
        用户会看到"选了黑色，红色显示 3 件，点进去只有 1 件"）。

        facet 计数是**析取式**：`facets[i].values[j].count` = 在"应用了除 `f[i]` 之外所有其它筛选"之后该值还能命中多少商品。
        包含式计数会让"选了 A 之后其它 A 值全显示 0"，用户以为无货。实现上 n 个维度要 n 次 `GROUP BY`
        （n ≤ 8，最多 9 次，走覆盖索引），**不得"优化"成一次**——那是本行业最常见的 facet bug。
        `count = 0` 的值后端过滤，不返回。

        `StockStatus` 判据：`available ≤ 0` → `out_of_stock`；`1..5` → `low_stock`；`> 5` → `in_stock`。
        `availableQuantity` 只在 `low_stock` 时给真实值，否则 `null`（"充足，不必关心精确数"；给 99 封顶是假信息，已废止）。
      security: []
      x-permission: null
      parameters:
        - { name: locale, in: query, required: false, schema: { type: string, enum: [zh, en], default: zh } }
        - { name: categorySlug, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - name: f
          in: query
          required: false
          description: '属性筛选，格式 attrCode:optionCode，可重复（例：?f=color:black&f=size:m）'
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}:[A-Za-z0-9_-]{1,40}$' }
        - { name: priceMinMinor, in: query, required: false, schema: { type: integer, minimum: 0, description: '最小货币单位（整数分）' } }
        - { name: priceMaxMinor, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: 分页商品列表（一次请求带 items + facets + availableSorts）
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=60' } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items, facets, availableSorts, hasActiveFilters, page, pageSize, total, pageCount]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, primaryImage, price, stockStatus, maxOrderQuantity]
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        name: { type: string }
                        primaryImage:
                          type: object
                          required: [url, alt, width, height, sources]
                          properties:
                            url: { type: string, description: '绝对 URL' }
                            alt: { type: string }
                            width: { type: integer }
                            height: { type: integer }
                            sources:
                              type: object
                              description: '三档响应式源，全为绝对 URL'
                              required: [sm, md, lg]
                              properties:
                                sm: { $ref: '#/components/schemas/ImageSource' }
                                md: { $ref: '#/components/schemas/ImageSource' }
                                lg: { $ref: '#/components/schemas/ImageSource' }
                        price: { $ref: '#/components/schemas/Money' }
                        compareAtPrice:
                          allOf:
                            - $ref: '#/components/schemas/Money'
                          nullable: true
                        stockStatus: { type: string, enum: [in_stock, low_stock, out_of_stock] }
                        availableQuantity:
                          type: integer
                          nullable: true
                          maximum: 5
                          description: '仅 stockStatus=low_stock（available ≤ 5）时给真实值，否则 null'
                        maxOrderQuantity: { type: integer, minimum: 0, maximum: 99 }
                        badges:
                          type: array
                          items: { type: string, enum: [new, sale, soldOut] }
                  facets:
                    type: array
                    description: 'filterable 属性；count 为**析取式**（剔除本维度条件后计算）；count=0 的值不返回'
                    items:
                      type: object
                      required: [code, label, type]
                      properties:
                        code: { type: string }
                        label: { type: string }
                        type: { type: string, enum: [enum, range] }
                        values:
                          type: array
                          items:
                            type: object
                            required: [code, label, count]
                            properties:
                              code: { type: string }
                              label: { type: string }
                              count: { type: integer, minimum: 1 }
                        range:
                          type: object
                          properties:
                            minMinor: { type: integer }
                            maxMinor: { type: integer }
                            unit: { type: string, nullable: true }
                  availableSorts:
                    type: array
                    description: '本分类下有数据的排序方式；newest 恒在'
                    items: { type: string, enum: [newest, price_asc, price_desc] }
                  hasActiveFilters: { type: boolean, description: '供前端决定是否显示"清除筛选"与 canonical 策略' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: '真实计数；0 才能渲染空态' }
                  pageCount: { type: integer }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/TooManyRequestsProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }

  /api/storefront/products/{slug}:
    get:
      operationId: getStorefrontProductBySlug
      tags: [Storefront.Catalog]
      summary: 商品详情 + 变体矩阵
      description: |
        三条必须在契约里写死的规则：

        1. **变体没有 `name`**：变体名 = 选项组合，前端自己拼（`key` + `options[]` 已经够用）。给变体起名会让"改名"变成
           一件要同步 100 个变体的事，而且和选项一旦不一致，前台就出现"黑色 / 尺码 M"配着"黑色L"的名字。
        2. **`purchasable` 而不是 `enabled`**：`enabled=false`（商家停用）与售罄（available=0）对买家是同一件事——置灰不可选。
           两个字段让前端在每个渲染点都要写一遍 `a || b`，必有一处漏。
        3. **`sku` 只在详情页返回**：列表页批量给 SKU 等于把内部编码喂给爬虫与竞品。

        页级无译文（该 locale 没有该商品的 slug/译文行）→ **`404`**，不是回退：`/en/p/中文slug` 若返回 200 + 中文内容，
        会产生"英文 URL 装中文页面"的可索引重复页，AC-14 直接红。字段级缺译文 → 回退默认语言 + `translatedIn` 不含该字段。
        已归档 → **`410 CATALOG_PRODUCT_GONE`**（内容永久没了，让搜索引擎更快摘除；301 会把权重导向不存在的地址）。
      security: []
      x-permission: null
      parameters:
        - { name: slug, in: path, required: true, description: 该 locale 下的商品 slug, schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 200 } }
        - { name: locale, in: query, required: false, schema: { type: string, enum: [zh, en], default: zh } }
      responses:
        '200':
          description: 商品详情
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=60' } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontProductDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '410': { $ref: '#/components/responses/GoneProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }

  /api/storefront/categories:
    get:
      operationId: listStorefrontCategories
      tags: [Storefront.Catalog]
      summary: 分类树（前台导航）
      description: |
        返回 `Status=Active` 的分类树（`Hidden` 不进前台，但仍可被直接 URL 访问——"不显示在导航"与"不可访问"是两件事）。
        缓存 60 分钟 + 分类版本号（变更即 bump，不做"等它自己过期"）。
      security: []
      x-permission: null
      parameters:
        - { name: locale, in: query, required: false, schema: { type: string, enum: [zh, en], default: zh } }
      responses:
        '200':
          description: 分类树（`children` 递归）
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=3600' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StorefrontCategoryNode' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }

  /api/storefront/bootstrap:
    get:
      operationId: getStorefrontBootstrap
      tags: [Storefront.Catalog]
      summary: SSR 首屏站点上下文（一次请求）
      description: |
        服务端渲染首屏需要的一切：店铺信息 + 主题 + 导航 + 购物车摘要。**一个往返**——SSR 每多一个串行请求，
        TTFB 就多一次 RTT，而首屏 TTFB 直接决定 LCP。

        `canSell=false` 时前端禁用"去结算"并显示中性原因；但**服务端仍必须二次拦截**（`/checkout/confirm` 的第一条语句断言它）：
        前端禁用只是 UX，改 JS 就绕过了。

        `store.canSellReason` 与 `503 CANNOT_SELL` 的 `details.reason` 是**同一套枚举** `{noCredentials, testFailed, channelDisabled}`
        （就是 `canSellReason` 去掉 `ok`），**共用一张表、不做改名映射**；`ok` 永不出现。
        另：**瞬时失败不走 `CANNOT_SELL`**，走 `PAYMENT_PROVIDER_UNAVAILABLE` —— 那是**另一个判定域**，
        `details.reason ∈ {providerTimeout, providerError, providerRateLimited}`（"这一次请求为什么失败"，与"现在为什么不能卖"互斥）。
        带 `ETag`：SSR 可用 `If-None-Match` 拿 `304`，省掉序列化与传输。
      security: []
      x-permission: null
      parameters:
        - { name: locale, in: query, required: false, schema: { type: string, enum: [zh, en], default: zh } }
        - name: If-None-Match
          in: header
          required: false
          description: 上一轮的 `ETag`；命中返回 `304`（无 body）
          schema: { type: string }
      responses:
        '200':
          description: 站点上下文
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontBootstrap' }
        '304': { description: 未变更（`If-None-Match` 命中） }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailableProblem' }

  # ==========================================================================
  # Health
  # ==========================================================================

  /health/live:
    get:
      operationId: healthLive
      tags: [Health]
      summary: 存活探针（不查 DB）
      description: |
        **只证明"进程还能响应"**，不碰数据库。理由：健康检查去 ping 数据库，数据库一抖动就会让编排把所有实例摘掉，
        把一次 DB 慢查询放大成一次全站 502。仅内网可访问（反代层限制）。
      security: []
      x-permission: null
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [live] }

  /health/ready:
    get:
      operationId: healthReady
      tags: [Health]
      summary: 就绪探针（查 DB / 迁移 / 媒体目录 / 模板目录）
      description: |
        **不检查"是否已完成安装"**：新部署未初始化也是 ready（否则首次部署永远起不来，向导页都打不开）。
        任一检查失败 → `503` + 明细（注意：是 `503`，不是 `200` + 空对象；反代的可用性告警要靠这个状态码才会响）。
      security: []
      x-permission: null
      responses:
        '200':
          description: 全部就绪
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
        '503':
          description: 至少一项未就绪
          headers:
            Retry-After: { schema: { type: integer, example: 30 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }

# ============================================================================
components:

  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: os_admin_sid
      description: |
        管理端会话 Cookie（32 字节随机 base64url，`HttpOnly; Secure; SameSite=Lax; Path=/api/admin`）。
        服务端只存 `SHA-256(token)` 作主键，DB 泄露不等于会话可被劫持。
        校验顺序：① TokenHash 命中 ② `RevokedAt is null` ③ 未过绝对过期 ④ 未过空闲过期 ⑤ `AdminUser.Status=Active` 且 `SecurityStamp` 未变。
        第 ⑤ 步让"改密/停用即踢下线"无需遍历会话。

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: 资源标识（**不透明字符串**：数据模型是 `long`、现有代码是 `Guid`、文档示例是 ULID 形态，本契约只承诺"字符串"，不承诺格式）
      schema: { type: string, minLength: 1, maxLength: 40 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        double-submit 校验：值取自**非 HttpOnly** Cookie `os_admin_csrf`。中间件顺序不能错：
        ① 会话有效 → ② `Origin` 是本站（缺失即拒）→ ③ `SHA256(header) == Session.CsrfHash`（常量时间比较）。
        任一不过 → `403 AUTH_CSRF_INVALID`。**不豁免任何写方法**，包括登录后的第一次写。
      schema: { type: string, minLength: 32, maxLength: 128 }
    Locale:
      name: locale
      in: query
      required: false
      description: 内容语言；缺省用 `StoreSettings.DefaultLocale`。非法值 → `400 LOCALE_NOT_ENABLED`
      schema: { type: string, enum: [zh, en], default: zh }
    Page:
      name: page
      in: query
      required: false
      description: '页码；上限 100。超上限 → `400 PAGE_OUT_OF_RANGE`；超过总页数（但 ≤100）→ `200 + items: []`'
      schema: { type: integer, minimum: 1, maximum: 100, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数；默认 24、上限 100。超限 → `400 PAGE_SIZE_EXCEEDED`
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }

  schemas:

    # ---------------------------------------------------------------- 基础值对象

    Money:
      type: object
      required: [amountMinor, currency]
      description: |
        **全项目唯一金额类型**。`amountMinor` 是最小货币单位的整数（分）。禁止小数、禁止字符串、禁止旧字段名 `amount`。
        二期加多币种时**不变成数组**：DTO 永远只暴露"当前 locale/店铺币种的这一个价"（§11 #15）。
      additionalProperties: false
      properties:
        amountMinor: { type: integer, example: 29900, description: '最小货币单位整数（CNY 的分）' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: CNY }

    ImageSource:
      type: object
      required: [url, width, height]
      description: 响应式图片源（绝对 URL）
      properties:
        url: { type: string, description: '绝对 URL（由 StoreSettings.PublicSiteUrl 拼出，不读 Host 头）' }
        width: { type: integer }
        height: { type: integer }

    ImageAsset:
      type: object
      required: [mediaKey, url, width, height, sources]
      description: 已入库的媒体资源（管理端上传返回与商品详情里的图片项）
      properties:
        mediaKey: { type: string, description: '存储键 `yyyy/MM/{sha256前16}`，无扩展名；派生尺寸按约定生成' }
        url: { type: string, description: 原图绝对 URL }
        width: { type: integer }
        height: { type: integer }
        alt: { type: string, nullable: true, description: 默认语言 alt }
        isPrimary: { type: boolean, description: '是否商品主图（INV-P08：有图则恰好一张）' }
        sortOrder: { type: integer }
        sources:
          type: object
          required: [sm, md, lg]
          properties:
            sm: { $ref: '#/components/schemas/ImageSource' }
            md: { $ref: '#/components/schemas/ImageSource' }
            lg: { $ref: '#/components/schemas/ImageSource' }

    LocalizedText:
      type: object
      description: |
        多语言文本，键是契约 locale 代码（`zh`/`en`）。**缺键 = 未译**（不是空字符串：空串会被当成"有译文但为空"，
        导致回退逻辑失效）。管理端写入时未提供的键表示"不修改/未译"，读取时缺失的键由前端回退默认语言。
      additionalProperties: false
      properties:
        zh: { type: string, maxLength: 4000 }
        en: { type: string, maxLength: 4000 }

    LocalizedSlug:
      type: object
      description: 每语言 slug（小写 + 连字符）。`(locale, slug)` 在该实体类型内全局唯一；缺失的键由服务端按对应语言名称规范化生成。
      additionalProperties: false
      properties:
        zh: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 200 }
        en: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 200 }

    PageMeta:
      type: object
      required: [page, pageSize, total, pageCount]
      description: 分页信封的四件套（每个分页响应都带，字段名固定）
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: '真实计数；0 才允许渲染空态' }
        pageCount: { type: integer, minimum: 0, description: '总页数（**不是 totalPages**）' }

    PermissionCode:
      type: string
      description: |
        权限点（`docs/03` §6.4 矩阵，Admin/Staff 两列）。角色 → 权限点是**代码内静态常量**，不建表。
        前端隐藏菜单只是 UX；**服务端 403 才是唯一权威**。
      enum:
        - perm:catalog.read
        - perm:catalog.write
        - perm:catalog.delete
        - perm:taxonomy.read
        - perm:taxonomy.write
        - perm:inventory.read
        - perm:inventory.adjust
        - perm:order.read
        - perm:order.fulfill
        - perm:order.cancel.unpaid
        - perm:order.cancel.paid
        - perm:refund.read
        - perm:refund.write
        - perm:return.read
        - perm:return.review
        - perm:customer.read
        - perm:theme.read
        - perm:theme.write
        - perm:localization.write
        - perm:settings.write
        - perm:payment.configure
        - perm:shipping.configure
        - perm:audit.read
        - perm:adminuser.write
        - perm:backup.export
        - perm:dashboard.read

    # ---------------------------------------------------------------- 认证

    AdminRole:
      type: string
      enum: [Admin, Staff]
      description: 只两种角色（不提供自定义角色）。`Staff` 无任何资金/破坏性权限点

    AdminStatus:
      type: string
      enum: [Active, Suspended]

    AdminIdentity:
      type: object
      required: [id, email, role, permissions]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/AdminRole' }
        permissions:
          type: array
          description: 该角色的全部权限点（Staff 只含矩阵里打勾的那些）
          items: { $ref: '#/components/schemas/PermissionCode' }

    # ---------------------------------------------------------------- 分类

    CategoryStatus:
      type: string
      enum: [Active, Hidden]
      description: Hidden = 不进前台导航，但直接 URL 仍可访问（"不显示"≠"不可访问"）

    AdminCategory:
      type: object
      required: [id, parentId, depth, sortOrder, status, names, slugs, childCount, productCount, version]
      properties:
        id: { type: string }
        parentId: { type: string, nullable: true, description: 'null = 一级分类' }
        depth: { type: integer, minimum: 0, maximum: 5 }
        sortOrder: { type: integer, description: 同层内唯一（INV-C03） }
        status: { $ref: '#/components/schemas/CategoryStatus' }
        names: { $ref: '#/components/schemas/LocalizedText' }
        slugs: { $ref: '#/components/schemas/LocalizedSlug' }
        attributeSetId: { type: string, nullable: true, description: 'null = 继承父链的属性集' }
        childCount: { type: integer, minimum: 0, description: 直接子分类数（删除拦截提示用） }
        productCount: { type: integer, minimum: 0, description: 本分类直属商品数（删除拦截提示用） }
        version: { type: integer, minimum: 1, description: '乐观锁令牌；随 PUT 回传，不匹配 → 409 CONCURRENT_UPDATE' }
        updatedAt: { type: string, format: date-time }
        children:
          type: array
          description: 子节点（仅 `GET /api/admin/categories` 返回树时内联；单节点查询为空数组）
          items: { $ref: '#/components/schemas/AdminCategory' }

    CategoryUpsertRequest:
      type: object
      required: [names]
      properties:
        parentId: { type: string, nullable: true, description: 'null = 一级分类。移动会校验无环（INV-C01）与深度 ≤5（INV-C02）' }
        sortOrder: { type: integer, minimum: 0, description: '缺省追加到同级末尾' }
        names:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: 默认语言（zh）必填；`en` 缺键 = 该语言未译（前台回退默认语言）
        slugs:
          allOf:
            - $ref: '#/components/schemas/LocalizedSlug'
          description: 缺省按对应语言 names 规范化生成；变更写 SlugHistory → 旧 URL 301
        attributeSetId: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CategoryStatus' }
        version: { type: integer, minimum: 1, description: '可选：带上即做乐观锁，不匹配 → 409 CONCURRENT_UPDATE' }

    CategorySortItem:
      type: object
      required: [id, parentId, sortOrder]
      properties:
        id: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- 属性 / 属性集

    AttributeDataType:
      type: string
      enum: [Text, MultilineText, Enum, MultiEnum, Number, Bool]

    AttributeScope:
      type: string
      enum: [Product, Variant]
      description: 'Variant 用于变体轴；`scope=Variant` 时只允许 `dataType=Enum`（INV-A04，否则矩阵无法枚举）'

    AttributeOption:
      type: object
      required: [id, code, labels, sortOrder, isActive]
      properties:
        id: { type: string }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        labels: { $ref: '#/components/schemas/LocalizedText' }
        colorHex: { type: string, nullable: true, pattern: '^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$', description: 色板型选项给主题用 }
        sortOrder: { type: integer }
        isActive: { type: boolean, description: 'false = 已废弃但仍被历史数据引用（不删行，避免孤儿 OptionId）' }

    AttributeDefinition:
      type: object
      required: [id, code, dataType, scope, filterable, sortOrder, isActive, names, usageCount, version]
      properties:
        id: { type: string }
        code: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}$', description: '全局唯一（INV-A01）。模板与筛选参数都用它引用' }
        dataType: { $ref: '#/components/schemas/AttributeDataType' }
        scope: { $ref: '#/components/schemas/AttributeScope' }
        filterable: { type: boolean, description: '能否进 facet 与列表筛选；只有 true 的属性进 facets' }
        unit:
          type: string
          nullable: true
          maxLength: 16
          description: '单位符号（mm/g），只做展示，不做换算'
        groupId: { type: string, nullable: true, description: 属性分组（仅管理端展示，不翻译） }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        names:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: 筛选器标题就是它，**必须翻译**
        helpTexts:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: 录入提示文案（可选）
        usageCount: { type: integer, minimum: 0, description: '被多少个商品引用；>0 时 dataType/scope 不可改、不可删（INV-A03）' }
        options:
          type: array
          description: 'Enum/MultiEnum 必填 ≥1 项（INV-A05）'
          items: { $ref: '#/components/schemas/AttributeOption' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    AttributeOptionUpsert:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        labels: { $ref: '#/components/schemas/LocalizedText' }
        colorHex: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean, default: true }

    AttributeUpsertRequest:
      type: object
      required: [code, dataType, scope, names]
      properties:
        code: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}$', description: '全局唯一；重复 → 409 CATALOG_CODE_DUPLICATE' }
        dataType: { $ref: '#/components/schemas/AttributeDataType' }
        scope: { $ref: '#/components/schemas/AttributeScope' }
        filterable: { type: boolean, default: false }
        unit: { type: string, nullable: true, maxLength: 16 }
        groupId: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean, default: true }
        names: { $ref: '#/components/schemas/LocalizedText' }
        helpTexts: { $ref: '#/components/schemas/LocalizedText' }
        options:
          type: array
          description: '按 code upsert：列表里没有的旧项被置 isActive=false（不删除）'
          items: { $ref: '#/components/schemas/AttributeOptionUpsert' }
        version: { type: integer, minimum: 1 }

    AttributeSetMember:
      type: object
      required: [attributeDefinitionId, code, isRequired, sortOrder]
      properties:
        attributeDefinitionId: { type: string }
        code: { type: string, description: 属性 code（冗余返回，便于前端渲染无需二次查表） }
        isRequired: { type: boolean, description: '必填挂在成员上：同一属性在不同分类可必填/选填' }
        sortOrder: { type: integer }

    AttributeSet:
      type: object
      required: [id, code, sortOrder, members, version]
      properties:
        id: { type: string }
        code: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}$', description: '唯一（INV-AS01）；名称仅管理端，不建翻译表' }
        sortOrder: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/AttributeSetMember' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    AttributeSetUpsertRequest:
      type: object
      required: [code, members]
      properties:
        code: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}$' }
        sortOrder: { type: integer, minimum: 0 }
        members:
          type: array
          description: '全量替换语义；Scope=Variant 成员 ≤3（INV-AS03 → 409 AXIS_LIMIT_EXCEEDED）'
          items:
            type: object
            required: [attributeDefinitionId, isRequired]
            properties:
              attributeDefinitionId: { type: string }
              isRequired: { type: boolean, default: false }
              sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }

    # ---------------------------------------------------------------- 商品（管理端）

    ProductStatus:
      type: string
      enum: [Draft, Active, Archived]
      description: '与 `src/OpenStore.Domain/Catalog/ProductStatus.cs` 逐字一致。Archived → storefront 410；Draft → 404'

    ProductAttributeValue:
      type: object
      required: [attributeCode]
      description: 商品级属性值（四列互斥。**恰好一列有值**：optionIds / numberValue / textValue / boolValue）
      properties:
        attributeCode: { type: string }
        optionIds:
          type: array
          description: 'Enum=1 项；MultiEnum=N 项'
          items: { type: string }
        textValue: { type: string, nullable: true, maxLength: 1000 }
        numberValue: { type: number, nullable: true, format: double }
        boolValue: { type: boolean, nullable: true }
        unit: { type: string, nullable: true, description: 只读回显（来自属性定义的 unit） }

    VariantOption:
      type: object
      required: [attributeCode, optionCode]
      description: 轴上的一个取值（`attributeCode` 对应 `AttributeDefinition.Code`，`optionCode` 对应 `AttributeOption.Code`）
      properties:
        attributeCode: { type: string }
        optionCode: { type: string }

    AdminVariant:
      type: object
      required: [id, sku, axisSignature, options, price, purchasable, stock, version]
      description: 管理端变体（**含库存三件套**，storefront 的变体 DTO 里没有这些字段）
      properties:
        id: { type: string }
        sku: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{0,63}$', description: '全局唯一（不过滤软删，防复用串号）' }
        axisSignature:
          type: string
          description: '规范化轴签名，形如 `color=black|size=m`（按 key 排序、小写）。它是 `(ProductId, AxisSignature)` 唯一索引的落点'
        options:
          type: array
          items: { $ref: '#/components/schemas/VariantOption' }
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        purchasable: { type: boolean, description: '等价于 Variant.Status=Enabled；false 不进前台可选集，历史订单不受影响' }
        barcode: { type: string, nullable: true, maxLength: 64 }
        imageMediaKey: { type: string, nullable: true, description: 'null = 回退商品主图' }
        imageUrl: { type: string, nullable: true, description: 绝对 URL（回退后的实际展示图） }
        weightGram: { type: integer, nullable: true, description: 'null = 回退商品级重量' }
        stock:
          type: object
          required: [onHand, reserved, sold, available]
          description: '管理端可见。`available = onHand − reserved − sold`（永不落库）'
          properties:
            onHand: { type: integer, minimum: 0 }
            reserved: { type: integer, minimum: 0 }
            sold: { type: integer, minimum: 0 }
            available: { type: integer }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    AdminProductListItem:
      type: object
      required: [id, name, status, variantCount, totalOnHand, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, description: 默认语言名（回退后的展示名） }
        status: { $ref: '#/components/schemas/ProductStatus' }
        variantCount: { type: integer, minimum: 0 }
        totalOnHand: { type: integer, minimum: 0, description: 全部变体 `onHand` 之和（**仅 admin**） }
        updatedAt: { type: string, format: date-time }

    AdminProductListResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminProductListItem' }

    ProductCreateRequest:
      type: object
      required: [names, categoryIds]
      properties:
        names: { $ref: '#/components/schemas/LocalizedText' }
        slugs:
          allOf:
            - $ref: '#/components/schemas/LocalizedSlug'
          description: 缺省按 names 规范化生成
        descriptionHtml: { type: string, nullable: true, description: '富文本，入库前 sanitize（剥离 <style>/style 属性/事件属性）' }
        shortDescription: { $ref: '#/components/schemas/LocalizedText' }
        categoryIds:
          type: array
          minItems: 1
          maxItems: 20
          description: '≥1（INV-P02）；分类必须是已存在的非删除分类'
          items: { type: string }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/ProductAttributeValue' }
        seo:
          type: object
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
        weightGram: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        internalCode: { type: string, nullable: true, maxLength: 64, description: 商家内部编码，不对外、不翻译 }

    ProductUpdateRequest:
      type: object
      description: 全量更新基础信息（**不含 images / variants**：那两个有独立写入口，避免同一事实两个来源）
      required: [names, categoryIds]
      properties:
        names: { $ref: '#/components/schemas/LocalizedText' }
        slugs: { $ref: '#/components/schemas/LocalizedSlug' }
        descriptionHtml: { type: string, nullable: true }
        shortDescription: { $ref: '#/components/schemas/LocalizedText' }
        categoryIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
        attributes:
          type: array
          description: 商品级属性值**全量替换**
          items: { $ref: '#/components/schemas/ProductAttributeValue' }
        seo:
          type: object
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
        weightGram: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        internalCode: { type: string, nullable: true, maxLength: 64 }
        internalNote: { type: string, nullable: true, maxLength: 2000, description: 内部备注（**永不进 storefront DTO**） }
        version: { type: integer, minimum: 1, description: '可选：带上即乐观锁（不匹配 → 409 CONCURRENT_UPDATE）' }

    AdminProductDetail:
      type: object
      required: [id, status, names, slugs, categories, images, variants, axes, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        publishedAt: { type: string, nullable: true, format: date-time, description: 首次上架时间（"新品"排序依据） }
        names: { $ref: '#/components/schemas/LocalizedText' }
        slugs: { $ref: '#/components/schemas/LocalizedSlug' }
        descriptionHtml: { type: string, nullable: true }
        shortDescription: { $ref: '#/components/schemas/LocalizedText' }
        seo:
          type: object
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
        internalCode: { type: string, nullable: true }
        internalNote: { type: string, nullable: true }
        weightGram: { type: integer, nullable: true }
        categories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string, nullable: true }
        axes:
          type: array
          description: 已生成的变体轴（≤3）。轴属性集合一旦生成不可在线变更（INV-P12 → 409 AXIS_IMMUTABLE）
          items:
            type: object
            required: [attributeCode, sortOrder]
            properties:
              attributeCode: { type: string }
              sortOrder: { type: integer }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/ProductAttributeValue' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageAsset' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AdminVariant' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- 变体矩阵

    VariantAxisInput:
      type: object
      required: [attributeCode, optionCodes]
      properties:
        attributeCode: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,39}$', description: '必须是 Scope=Variant 且 DataType=Enum 的属性（否则 409 AXIS_SCOPE_INVALID）' }
        optionCodes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }

    VariantPlanRequest:
      type: object
      required: [axes]
      properties:
        axes:
          type: array
          maxItems: 3
          description: '≤3 轴（INV-P04，超出 → 409 AXIS_LIMIT_EXCEEDED）。空数组 = 收起成单规格商品'
          items: { $ref: '#/components/schemas/VariantAxisInput' }

    VariantPlanItem:
      type: object
      required: [axisSignature, options]
      properties:
        variantId: { type: string, nullable: true, description: '`toAdd` 里为 null（还不存在）' }
        sku: { type: string, nullable: true, description: '`toAdd` 里是**建议 SKU**（由轴值生成，供前端预填），商家可改后提交；服务端只校验格式与全局唯一，不维护 SKU 前缀规则' }
        axisSignature: { type: string, example: 'color=black|size=m' }
        options:
          type: array
          items: { $ref: '#/components/schemas/VariantOption' }
        purchasable: { type: boolean, description: '当前是否启用（`toAdd` 里无意义，可忽略）' }
        hasSales: { type: boolean, description: '是否有销量：决定"不在新组合里"的变体是进 `toDisable` 还是 `toDelete`（INV-P09）' }

    VariantPlanWarning:
      type: object
      required: [code, message]
      description: 让管理员在点 apply 之前就知道代价（"将删除 12 个 SKU"、"这些新变体还没价格，上架会被拦"）
      properties:
        code:
          type: string
          enum: [variantsToBeDeleted, variantsToBeDisabledWithSales, newVariantsWithoutPrice, skuDerivationCollision, axesCollapsedToSingleSpec]
        message: { type: string, description: 中文可读说明（含数量与示例 SKU） }
        axisSignature: { type: string, nullable: true }

    VariantMatrixPlan:
      type: object
      required: [toAdd, toKeep, toDisable, toDelete, warnings, summary]
      description: |
        四桶计划。`toDelete` **只包含"不在新组合中且无销量"的变体**；有销量的一律进 `toDisable`（INV-P09：
        已产生销量的变体不可删除，只能停用，否则历史订单会指向一个不存在的实体）。
      properties:
        toAdd:
          type: array
          items: { $ref: '#/components/schemas/VariantPlanItem' }
        toKeep:
          type: array
          items: { $ref: '#/components/schemas/VariantPlanItem' }
        toDisable:
          type: array
          items: { $ref: '#/components/schemas/VariantPlanItem' }
        toDelete:
          type: array
          items: { $ref: '#/components/schemas/VariantPlanItem' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/VariantPlanWarning' }
        summary:
          type: object
          required: [add, keep, disable, delete]
          properties:
            add: { type: integer, minimum: 0 }
            keep: { type: integer, minimum: 0 }
            disable: { type: integer, minimum: 0 }
            delete: { type: integer, minimum: 0 }

    VariantApplyRequest:
      description: 二选一：提交 `plan`（把 `variants/plan` 的返回原样回传）或提交 `axes`（服务端重算后应用）
      oneOf:
        - type: object
          required: [plan]
          properties:
            plan: { $ref: '#/components/schemas/VariantMatrixPlan' }
        - type: object
          required: [axes]
          properties:
            axes:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/VariantAxisInput' }

    VariantPatchRequest:
      type: object
      description: |
        部分更新（只改传了的键）。要"清除划线价"请显式传 `compareAtPrice: null`；**不传**这个键表示"不改"。
      additionalProperties: false
      properties:
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        imageMediaKey: { type: string, nullable: true, description: 'null = 回退商品主图' }
        barcode: { type: string, nullable: true, maxLength: 64 }
        purchasable: { type: boolean, description: 'false = 停用该变体（不进前台可选集，历史订单不受影响）' }
        weightGram: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }

    VariantBulkUpdateRequest:
      type: object
      required: [variantIds]
      description: 单事务：任一变体失败则全部不生效（部分成功会让管理员无法判断改了哪些）
      properties:
        variantIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        onHand:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
          description: '把 `onHand` 设为该值（走 AdjustOnHand + 流水）。传此键时 `reason` 必填'
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: '`onHand` 存在时**必填**（US-E2-08）：流水的 Reason，缺 → 400 VALIDATION_FAILED'

    ImageOrderItem:
      type: object
      required: [mediaKey, sortOrder, isPrimary]
      properties:
        mediaKey: { type: string, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }

    # ---------------------------------------------------------------- 库存

    InventoryListItem:
      type: object
      required: [variantId, sku, productName, onHand, reserved, sold, available, updatedAt]
      properties:
        variantId: { type: string }
        sku: { type: string }
        productName: { type: string }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0, description: 已下单未支付的预占 }
        sold: { type: integer, minimum: 0, description: 已支付未发货的占用（货还在仓） }
        available: { type: integer, description: 'onHand − reserved − sold' }
        updatedAt: { type: string, format: date-time }

    InventoryListResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InventoryListItem' }

    InventoryMovement:
      type: object
      required: [occurredAt, changeType, operator, onHandBefore, onHandAfter, delta]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        changeType:
          type: string
          description: 变化类型（与 `StockLedger.ChangeType` 一致，只追加不可改）
          enum: [Initial, ManualAdjust, Reserve, Release, Commit, Ship, RefundRestock, RefundUncommit]
        operator:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [System, Admin, Customer] }
            id: { type: string, nullable: true }
            name: { type: string, nullable: true, description: 操作人名称快照（人员改名后流水仍还原当时身份） }
        onHandBefore: { type: integer }
        onHandAfter: { type: integer }
        delta: { type: integer, description: 'onHandAfter − onHandBefore（有符号）' }
        reservedAfter: { type: integer, description: 后置快照，与 delta 互为校验（delta + before = after） }
        soldAfter: { type: integer }
        reason: { type: string, nullable: true, description: '手工调整必填（US-E2-08）' }
        orderNumber: { type: string, nullable: true, description: 来自订单时填写（可据此 grep 完整链路） }
        holdId: { type: string, nullable: true, description: 预占凭据（Commit/Release 的幂等键） }

    InventoryMovementListResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InventoryMovement' }

    # ---------------------------------------------------------------- storefront

    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: '判据：available ≤ 0 → out_of_stock；1..5 → low_stock；> 5 → in_stock（前端只认这一个字段）'

    StorefrontCategoryNode:
      type: object
      required: [id, slug, name, sortOrder, children]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/StorefrontCategoryNode' }

    StorefrontProductVariant:
      type: object
      required: [key, options, purchasable, price, stockStatus, maxOrderQuantity]
      properties:
        key:
          type: string
          description: '稳定标识 = `options` 的规范化拼接（如 `color=black|size=m`）。**变体没有 name**，名字由前端拼'
        options:
          type: array
          items: { $ref: '#/components/schemas/VariantOption' }
        purchasable:
          type: boolean
          description: '商家停用 或 售罄 → false。前端置灰用它，不要自己拼 `enabled && available>0`'
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        availableQuantity:
          type: integer
          nullable: true
          maximum: 5
          description: '仅 available ≤ 5 时给真实值，否则 null（封顶成 99 是假信息，已废止）'
        maxOrderQuantity: { type: integer, minimum: 0, maximum: 99 }
        sku: { type: string, description: '**只在详情页返回**（列表页批量给 SKU = 把内部编码喂给爬虫）' }
        imageUrl: { type: string, nullable: true, description: 绝对 URL；null = 用商品主图 }

    StorefrontProductDetail:
      type: object
      required: [id, slug, name, images, variantAxes, variants, translatedIn, maxOrderQuantity]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string, nullable: true }
        descriptionHtml: { type: string, nullable: true, description: 已 sanitize（无 `<style>`/`style` 属性/事件属性） }
        images:
          type: array
          items:
            type: object
            required: [url, alt, width, height, sources]
            properties:
              url: { type: string }
              alt: { type: string }
              width: { type: integer }
              height: { type: integer }
              sources:
                type: object
                required: [sm, md, lg]
                properties:
                  sm: { $ref: '#/components/schemas/ImageSource' }
                  md: { $ref: '#/components/schemas/ImageSource' }
                  lg: { $ref: '#/components/schemas/ImageSource' }
        attributeGroups:
          type: array
          description: 商品级属性（按分组展示；供"规格参数"表格）
          items:
            type: object
            required: [name, items]
            properties:
              name: { type: string, description: 分组名（属性分组名不翻译，故为单串） }
              items:
                type: array
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: string }
        variantAxes:
          type: array
          description: 变体选择器（≤3 轴）。`available=false` 的选项前端置灰（其余轴已选定的前提下无货）
          items:
            type: object
            required: [code, name, options]
            properties:
              code: { type: string }
              name: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [code, name, available]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    available: { type: boolean }
        variants:
          type: array
          items: { $ref: '#/components/schemas/StorefrontProductVariant' }
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '展示价（可售变体最低价）。`maxOrderQuantity` 在详情页也给一份，避免前端从变体里取值时漏默认值'
        compareAtPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        maxOrderQuantity: { type: integer, minimum: 0, maximum: 99 }
        translatedIn:
          type: array
          description: '哪些 locale 有**实体级**译文行（决定 hreflang 与语言切换器）。页级不存在 → 该 locale 直接 404，不进此数组'
          items: { type: string, enum: [zh, en] }
        seo:
          type: object
          required: [title, description]
          properties:
            title: { type: string }
            description: { type: string }
            jsonLd:
              type: object
              nullable: true
              additionalProperties: true
              description: '可选的 Product JSON-LD 片段（`sku` 只在这里、只在详情页出现）。canonical/og:url **不由后端出**（依赖前端当前页与筛选状态）'

    StorefrontBootstrap:
      type: object
      required: [store, theme, nav, cartSummary]
      properties:
        store:
          type: object
          required: [name, logoUrl, publicSiteUrl, timeZone, currency, locales, defaultLocale, guestCheckoutEnabled, canSell]
          properties:
            name: { type: string }
            logoUrl: { type: string, nullable: true, description: '绝对 URL' }
            publicSiteUrl: { type: string, description: '绝对 URL，无尾斜杠。**所有对外绝对 URL 的唯一来源**（不读 Host 头，AC-10）' }
            timeZone: { type: string, example: Asia/Shanghai, description: IANA 时区名 }
            currency: { type: string, pattern: '^[A-Z]{3}$', example: CNY }
            locales:
              type: array
              items: { type: string, enum: [zh, en] }
            defaultLocale: { type: string, enum: [zh, en] }
            guestCheckoutEnabled: { type: boolean }
            canSell:
              type: boolean
              description: '派生值：凭据已填 && 最近一次测试成功 && 通道启用。**没有"人工关闭"这一种**'
            canSellReason:
              type: string
              nullable: true
              enum: [noCredentials, testFailed, channelDisabled]
              description: '`canSell=false` 时给**中性**原因（前台不出现"未配置密钥"这类运维语言）。与 `503 CANNOT_SELL` 的 `details.reason` **同一套枚举**（后者即本枚举去掉 `ok`），共用一张表。`ok` 只在 `canSell=true` 时出现'
        theme:
          type: object
          required: [activeThemeId, tokens, blocks, texts]
          description: 三层合并（themeDefaults → templateDefaults → instanceOverrides）已在服务端完成，前端直接渲染
          properties:
            activeThemeId: { type: string }
            tokens:
              type: object
              additionalProperties: true
              description: 设计令牌（颜色/字号/间距），键名由主题 schema 定义
            blocks:
              type: array
              items: { type: object, additionalProperties: true }
              description: 首页区块编排（顺序即数组顺序）
            texts:
              type: object
              additionalProperties: true
              description: 主题文案（已按 locale 解析）
        nav:
          type: object
          required: [tree]
          properties:
            tree:
              type: array
              items: { $ref: '#/components/schemas/StorefrontCategoryNode' }
        cartSummary:
          type: object
          required: [count, subtotal]
          description: '**金额是对象**：`docs/03` §5.3.1 此处写作 `subtotalAmountMinor`（裸数字），本契约按 §5.1「金额一律对象」收敛为 `subtotal: Money`'
          properties:
            count: { type: integer, minimum: 0, description: 购物车行数（不是件数；件数需前端求和或另加 field） }
            itemCount: { type: integer, minimum: 0, description: 件数合计（qty 之和） }
            subtotal: { $ref: '#/components/schemas/Money' }
            currency: { type: string, pattern: '^[A-Z]{3}$', description: 冗余回显，便于空车时也渲染币种符号 }

    # ---------------------------------------------------------------- Health

    HealthCheckResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [up, down] }
        detail: { type: string, nullable: true, description: '失败原因（**不出现连接串、路径以外的敏感信息**）' }
        durationMs: { type: integer, minimum: 0 }

    HealthReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded] }
        checks:
          type: object
          required: [db, migrations, mediaDir, templatesDir]
          description: |
            四项必须全 `up` 才 200：
            - `db`：连接可用 + 一次 `SELECT 1`
            - `migrations`：待执行迁移数 > 0 → `down`（滚动发布期间新实例不该先接流量）
            - `mediaDir`：媒体目录可读可写
            - `templatesDir`：主题/模板目录可读
          properties:
            db: { $ref: '#/components/schemas/HealthCheckResult' }
            migrations: { $ref: '#/components/schemas/HealthCheckResult' }
            mediaDir: { $ref: '#/components/schemas/HealthCheckResult' }
            templatesDir: { $ref: '#/components/schemas/HealthCheckResult' }
        checkedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- 错误

    ProblemCode:
      type: string
      description: |
        错误码**封闭枚举**。前缀分段与 `docs/03` §5.1「错误码分段」表一致；表里只给了示例，本枚举给出本轮端点用到的**全部具体码**
        （比表多出来的码逐条记在 `x-doc-deltas` D18，均为既有前缀族内的具体化，未新增前缀族）。
        前端只写一套 `code → i18n key` 的映射，**不得按 `title` 文案做判断**（文案会变，码不会）。

        不在本枚举内的前缀族 = **本轮没有对应端点**，不是"用不到"：`CART_*` `CHECKOUT_*` `PAYMENT_*`（含 `CANNOT_SELL`）
        `ORDER_*`（`ORDER_NOT_FOUND` 除外，查单需要）`REFUND_*` `THEME_*` `CONTENT_*` `IDEMPOTENCY_*` `WEBHOOK_*`
        要等 M2/M3 的端点一起进契约 —— 契约里不出现的码，实现期也不许返回（否则前端映射表会静默走 default 分支）。

        **反方向不成立：在枚举内 ≠ 有端点。** 本枚举回答的是"**允许**返回哪些码"（前端 `code → i18n` 映射表的封闭集合），
        不是"有哪些路径"。两者是不同维度，混起来会得出两个都错的结论：
        - **在枚举内、本轮无端点** → 这是**契约先行**的码：前端与运维/测试脚本**可以依赖**它（写映射、写断言、写 Runbook 分支），
          但**不要指望本轮能真的调出这个响应**。这是排期问题，不是契约问题；把它从枚举里删掉才是破坏契约。
        - **不在枚举内、但有端点** → 这是**缺陷**，必须先补枚举再用（`x-doc-deltas` D18 就是这条的执行痕迹）。

        **例外：三个向导码 `SetupAlreadyCompleted` / `SetupInProgress` / `SetupResetting` 已先行登记在本枚举里**（虽然
        `/api/setup/*` 的路径表还没补齐）。理由：它们的拼写已被 `docs/01`、`docs/03` §5.1、架构三处声明为**契约**，
        而"改错误码等于破坏契约"这条约束**缺了枚举就成了唯一没有机器执行的地方** —— 前端只能手写字符串，写错一个字母
        不报错，只表现为"向导页面卡在加载态"。**PascalCase 是需求原文，不要"统一"成大写下划线。**
      enum:
        # --- AUTH_* 登录/会话/权限
        - AUTH_INVALID_CREDENTIALS
        - AUTH_LOCKED
        - AUTH_SESSION_EXPIRED
        - AUTH_FORBIDDEN
        - AUTH_CSRF_INVALID
        # --- VALIDATION_* 入参
        - VALIDATION_FAILED
        - PAGE_SIZE_EXCEEDED
        - PAGE_OUT_OF_RANGE
        - LOCALE_NOT_ENABLED
        # --- CATALOG_* 商品域
        - CATALOG_NOT_FOUND
        - CATALOG_PRODUCT_GONE
        - CATALOG_CATEGORY_NOT_EMPTY
        - CATALOG_CATEGORY_CYCLE
        - CATALOG_CATEGORY_DEPTH_EXCEEDED
        - CATALOG_CATEGORY_SORT_CONFLICT
        - CATALOG_ATTRIBUTE_IN_USE
        - CATALOG_CODE_DUPLICATE
        # --- INV_* 商品不变量
        - INV_PRODUCT_NAME_REQUIRED
        - INV_PRODUCT_CATEGORY_REQUIRED
        - INV_PRICE_INVALID
        - INV_PRIMARY_IMAGE_INVALID
        # --- AXIS_*
        - AXIS_LIMIT_EXCEEDED
        - AXIS_SCOPE_INVALID
        - AXIS_IMMUTABLE
        # --- VARIANT_*
        - VARIANT_LIMIT_EXCEEDED
        - VARIANT_COMBINATION_DUPLICATE
        - VARIANT_HAS_SALES_CANNOT_DELETE
        - VARIANT_AXES_REQUIRED
        - VARIANT_AXIS_VALUE_INVALID
        # --- SKU_*
        - SKU_DUPLICATE
        # --- PRODUCT_* / CURRENCY_*
        - PRODUCT_NOT_PUBLISHABLE
        - PRODUCT_STATUS_INVALID
        - CURRENCY_MISMATCH
        # --- INVENTORY_*
        - INSUFFICIENT_STOCK
        - STOCK_CHANGED_RETRY
        - INVENTORY_NEGATIVE_FORBIDDEN
        # --- Setup（路径随 M2 进契约，三个字面量先登记；PascalCase 逐字照抄需求原文，不要规范化）
        - SetupAlreadyCompleted
        - SetupInProgress
        - SetupResetting
        # --- 并发 / 限流 / 兜底
        - CONCURRENT_UPDATE
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_UNEXPECTED
        - SERVICE_UNAVAILABLE
        - ORDER_NOT_FOUND

    Problem:
      type: object
      description: |
        RFC 7807 + 扩展字段。**唯一的错误响应形状**（全项目只有 `ExceptionProblemDetailsMiddleware` 一个出口，
        端点与服务里禁止 `try/catch → return []`：把异常吞成空列表会让"200 的空白商品页"被搜索引擎收录）。
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: '问题类型 URI（`https://openstore.dev/errors/{kebab-case-code}`），用于机器识别'
        title: { type: string, description: 人读标题（默认语言兜底；前端可按 i18n key 重译） }
        status: { type: integer, description: HTTP 状态码（与响应行一致） }
        detail: { type: string, nullable: true, description: '**绝不包含 `ex.Message`**（可能含 SQL/路径）；storefront 侧一律中性文案' }
        instance: { type: string, nullable: true, description: 出问题的请求路径 }
        code: { $ref: '#/components/schemas/ProblemCode' }
        correlationId: { type: string, description: '服务端生成/透传的请求 id；客服与运维靠它 grep 日志定位（响应头 `X-Request-Id` 同值）' }
        errors:
          type: object
          nullable: true
          description: 字段级校验错误（仅 `400 VALIDATION_FAILED`），键 = **camelCase 契约字段名**（与 OpenAPI 一致），值 = 消息数组
          additionalProperties:
            type: array
            items: { type: string }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            按 code 变化的机器可读上下文（前端据此做差异化 UI，不必解析文案）：
            - `AUTH_LOCKED` → `{unlockAt}`（明确告知何时可试，减少客服）
            - `CANNOT_SELL` → `{reason, fixPath}`（storefront 只用 reason 的中性文案）
            - `INVENTORY_NEGATIVE_FORBIDDEN` → `{reserved, sold, minimumOnHand}`
            - `CATALOG_CATEGORY_NOT_EMPTY` → `{childCount, productCount}`
            - `PRODUCT_NOT_PUBLISHABLE` → `{reasons[]}`
            - `RATE_LIMIT_EXCEEDED` → `{scope}`（`read`/`write`/`login`/…，便于前端区分提示语）

  responses:

    Problem:
      description: RFC 7807 通用错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ValidationProblem:
      description: 入参校验失败（`400 VALIDATION_FAILED` / `PAGE_SIZE_EXCEEDED` / `PAGE_OUT_OF_RANGE` / `LOCALE_NOT_ENABLED`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/validation-failed
            title: 提交内容有误
            status: 400
            detail: 有 2 个字段未通过校验
            instance: /api/admin/products
            code: VALIDATION_FAILED
            correlationId: 0HMZ7Q2K9V3T1
            errors:
              names: ['默认语言名称必填']
              categoryIds: ['至少选择 1 个分类']
            details: null

    UnauthorizedProblem:
      description: 未认证（`401 AUTH_SESSION_EXPIRED` / 登录失败 `401 AUTH_INVALID_CREDENTIALS`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/auth-session-expired
            title: 请重新登录
            status: 401
            detail: 会话已过期或不存在
            instance: /api/admin/products
            code: AUTH_SESSION_EXPIRED
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details: null

    ForbiddenProblem:
      description: 已认证但无权限（`403 AUTH_FORBIDDEN` 缺权限点 / `403 AUTH_CSRF_INVALID` CSRF 或 Origin 校验失败）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/auth-forbidden
            title: 无权访问
            status: 403
            detail: 当前账号缺少权限点 perm:catalog.delete
            instance: /api/admin/products/01J8ZF9H2X
            code: AUTH_FORBIDDEN
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details: null

    NotFoundProblem:
      description: 资源不存在（`404 CATALOG_NOT_FOUND` / `404 ORDER_NOT_FOUND`）。**越权也走它**：403 等于确认"该资源存在"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/catalog-not-found
            title: 未找到
            status: 404
            detail: 商品不存在或已删除
            instance: /api/admin/products/01J8ZF9H2X
            code: CATALOG_NOT_FOUND
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details: null

    GoneProblem:
      description: 资源曾存在但已永久下线（`410 CATALOG_PRODUCT_GONE`）。storefront 商品页专用：**不带任何详情**
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/catalog-product-gone
            title: 商品已下架
            status: 410
            detail: 该商品已下架
            instance: /api/storefront/products/rm-s1-servo
            code: CATALOG_PRODUCT_GONE
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details: null

    ConflictProblem:
      description: |
        业务规则或状态冲突（`409`）。不带 `Retry-After` 的是"改了状态才能继续"（如 `PRODUCT_NOT_PUBLISHABLE`、
        `INVENTORY_NEGATIVE_FORBIDDEN`、`CATALOG_CATEGORY_NOT_EMPTY`、`STOCK_CHANGED_RETRY`、`CONCURRENT_UPDATE`）。
        **`409` 一律表示"请求格式没错，是当前状态不允许"**，不用 400。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/product-not-publishable
            title: 当前状态不允许上架
            status: 409
            detail: 商品缺少可售条件
            instance: /api/admin/products/01J8ZF9H2X/publish
            code: PRODUCT_NOT_PUBLISHABLE
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details:
              reasons: ['至少需要 1 个启用的变体', '至少需要 1 张图片', '变体 SERVO-COLO-BLACK 没有价格']

    LockedProblem:
      description: 账号被锁定（`423 AUTH_LOCKED`）。连续 5 次失败锁 15 分钟；`details.unlockAt` 明确告知何时可试
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/auth-locked
            title: 账号已临时锁定
            status: 423
            detail: 连续登录失败次数过多，请稍后再试
            instance: /api/admin/auth/login
            code: AUTH_LOCKED
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details:
              unlockAt: '2025-11-15T17:02:00+08:00'

    TooManyRequestsProblem:
      description: 限流（`429 RATE_LIMIT_EXCEEDED` + `Retry-After`）。`details.scope` 标明命中的策略（`read`/`write`/`login`/…）
      headers:
        Retry-After: { schema: { type: integer, example: 30 }, description: 建议等待秒数 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/rate-limit-exceeded
            title: 请求太频繁
            status: 429
            detail: 请稍后再试
            instance: /api/admin/products
            code: RATE_LIMIT_EXCEEDED
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details:
              scope: admin-write

    ServiceUnavailableProblem:
      description: |
        数据源/依赖不可用（`503 SERVICE_UNAVAILABLE`）。**这是"绝不把异常吞成 200 + 空列表"的落点**：
        DB 故障、查询报错、缓存后源数据读失败一律 503 + `Retry-After`，让反代的可用性告警能响、让前端渲染"暂时不可用"
        并给该错误页输出 `noindex`（空壳页被索引比不索引更糟）。
      headers:
        Retry-After: { schema: { type: integer, example: 30 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://openstore.dev/errors/service-unavailable
            title: 服务暂时不可用
            status: 503
            detail: 数据暂时不可用，请稍后重试
            instance: /api/storefront/products
            code: SERVICE_UNAVAILABLE
            correlationId: 0HMZ7Q2K9V3T1
            errors: null
            details: null

# ============================================================================
x-doc-deltas:
  description: |
    本契约与 `docs/03-后端设计.md` §5 的**表述级**差异（语义级冲突已上报主理人裁决）。每条都给了理由；
    反向修改文档或修改契约都必须同步这张表，否则下一个人会以为其中一边写错了。
    **`state: resolved` 的条目是"已消解的历史冲突"，不是待办** —— 编号保留只为追溯，处理时不要把它
    当成"这边和文档还不一致"。没有 `state` 字段的条目才是尚未消解、需要两侧保持同步的差异。
  items:
    - id: D1
      where: docs/03 §5.3.1 `GET /api/storefront/bootstrap` → `cartSummary{count,subtotalAmountMinor}`
      contract: '`cartSummary.subtotal: Money`（+ 冗余 `currency`、件数 `itemCount`）'
      why: '§5.1 明令"金额一律 {amountMinor,currency} 对象、禁止裸数字"，与同一文档 §5.3.1 的写法自相矛盾。以 §5.1 为准'
    - id: D2
      where: docs/03 §5.4 `GET /api/admin/inventory/{variantId}/movements`（给了 `page` 参数但响应是裸数组）
      contract: '统一分页信封 `{items,page,pageSize,total,pageCount}`'
      why: '§5.1「分页（统一）」优先。裸数组 + page 参数会让前端必须为这一个接口写第二套解析'
    - id: D3
      where: docs/03 §5.4 `GET/POST/PUT/DELETE /api/admin/attributes`（请求字段列了 `required`）
      contract: '属性定义层无 `required`；必填落在 `attributeSet.members[].isRequired`'
      why: '数据模型 §3.1 把 `IsRequired` 放在 `AttributeSetMember` 上（同一属性在不同分类可必填/选填）。定义层再加一个 required 就是两个真源'
    - id: D4
      where: docs/03 §5.4 `GET/PUT /api/admin/products/{id}`（"同上 + `images[]` `variants[]`"）
      contract: 'PUT 只改基础信息，不含 `images`/`variants`（各有独立写入口）'
      why: '同一事实两个写入口必然漂移（主图/变体状态最后谁生效取决于请求先后）。契约里只保留一个写路径'
    - id: D5
      where: docs/03 §5.4 `GET /api/admin/products/{id}`（"含成本价"）
      contract: 'admin DTO 出现 `internalCode`/`internalNote`/库存三件套，**不出现成本价**（主理人裁决 R3 已批准）'
      why: |
        **M1 明确去掉"成本价"，不是遗漏**：
        1. 数据模型 `Product`/`ProductVariant` **没有成本列**（`Product` 只有 `InternalCode`，`ProductVariant` 只有 `AmountMinor/CompareAtMinor/Currency`）。
        2. 契约不能凭空声明一个没有持久化的字段 —— 那会让"契约是单一真源"退化成"契约是一份愿望清单"，
           前端按契约生成表单、后端无处存，最后变成"填了没反应"的静默失败。
        3. 若 M1 之后确实需要成本/毛利（用于报表），正确顺序是：先加列（`ProductVariant.CostMinor` + `Currency` 同源）
           → 再扩契约（**新增字段属非破坏性变更**，前端可继续忽略它）→ 最后做毛利视图。
           反向顺序（先写契约后加列）会让契约与库在同一个里程碑内不一致，是最容易被评审放过去的一类债。
    - id: D6
      where: docs/03 §5.4 `POST /api/admin/products/{id}/variants/apply`（响应"最新变体列表"）
      contract: '响应对象 `{changed, applied{added,kept,disabled,deleted}, variants[]}`'
      why: '幂等语义要可观测：`changed:false` 是"重复 apply 无变化"这一断言在 HTTP 层的唯一观测点，裸数组表达不了'
    - id: D7
      where: docs/03 §5.4 `POST /api/admin/products/{id}/variants/bulk`（字段 `variantIds[] price? onHand?`）
      contract: '增加 `reason`（有 `onHand` 时必填）'
      why: 'INV-S03/US-E2-08 要求手工调整必须留原因。批量改库存同样是手工调整，缺 reason 的流水与"有人绕过 API 改库"无法区分'
    - id: D8
      where: docs/03 §5.4 `GET /api/admin/categories`（分类 CRUD 与 `/{id}` 写在一行）
      contract: '拆成 6 个独立操作：列表(树) / 新建 / 详情 / 更新 / 删除 / 排序'
      why: '一行表格无法表达各自的入参、状态码与错误码；契约必须逐一可校验（也是 `x-permission` 逐端点声明的前提）'
    - id: D9
      where: docs/03 §5.4 `POST /api/admin/products/{id}/publish`（`204`）
      contract: '保持 `204`，但补 `409 PRODUCT_NOT_PUBLISHABLE` + `details.reasons[]`'
