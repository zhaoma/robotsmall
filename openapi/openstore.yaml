            schema: { $ref: '#/components/schemas/AttributeSetUpsertRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Location: { schema: { type: string, example: /api/admin/attribute-sets/01J8ZE7Q1R } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeSet' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /api/admin/attribute-sets/{id}:
    get:
      operationId: adminGetAttributeSet
      tags: [Admin.Taxonomy]
      summary: 属性集详情
      security: [{ adminSession: [] }]
