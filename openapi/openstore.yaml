        `options` 按 `code` upsert：列表里没有的旧 option **不删除**，置为 `isActive=false`（已被商品引用时必须保留行，否则
        `ProductAttributeValue.OptionId` 会成孤儿）。`dataType`/`scope` 在有使用时报 `409 CATALOG_ATTRIBUTE_IN_USE`，
        `details{usageCount}` 让前端知道"先解绑多少个商品才能改"。
      security: [{ adminSession: [] }]
      x-permission: perm:taxonomy.write
      x-csrf-required: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CsrfToken'
