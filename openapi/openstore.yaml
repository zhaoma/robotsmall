    post:
      operationId: adminCreateAttributeSet
      tags: [Admin.Taxonomy]
      summary: 新建属性集
      description: |
        INV-AS01/02/03：`code` 唯一（冲突 → `409 CATALOG_CODE_DUPLICATE`）、成员属性不重复（`409 VALIDATION_FAILED` 字段级）、
        `Scope=Variant` 的成员数 ≤ 3（`409 AXIS_LIMIT_EXCEEDED`）。`isRequired` 挂在成员上（同一属性在不同分类可必填/选填）。
      security: [{ adminSession: [] }]
